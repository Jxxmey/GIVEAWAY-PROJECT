    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#ffffff" />

    <link id="app-manifest" rel="manifest" href="/manifest.json" />
    
    <script>
      // ตรวจสอบว่าเป็นหน้า Admin หรือไม่
      if (window.location.pathname.includes("@jaiidees_only")) {
        // 1. เปลี่ยนไฟล์ Manifest เป็นของ Admin
        var manifestLink = document.getElementById('app-manifest');
        if (manifestLink) {
            manifestLink.setAttribute('href', '/admin_manifest.json');
        }

        // 2. เปลี่ยน Theme Color ให้เป็นสีเข้มตามแอป Admin
        var themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) {
            themeColor.setAttribute('content', '#1e293b');
        }

        // 3. เปลี่ยนชื่อแอปเวลา Add to Homescreen บน iOS
        var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if (appleTitle) {
            appleTitle.setAttribute('content', 'Riser Admin');
        }

        // 4. เปลี่ยน Title ของหน้าเว็บ
        document.title = "Riser Admin System";
      }
    </script>
